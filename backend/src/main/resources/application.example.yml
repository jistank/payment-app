# Local development example with an in-memory H2 database.
# Copy this file to application-local.yml and start the app with
# SPRING_PROFILES_ACTIVE=local if you do not want to run PostgreSQL.
spring:
  application:
    name: payment
  datasource:
    url: jdbc:h2:mem:payment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  top-up:
    enabled: ${TOPUP_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@payment-app.local}
  verification:
    secret: ${VERIFICATION_CODE_SECRET:dev-only-change-me}
  password-reset:
    secret: ${PASSWORD_RESET_TOKEN_SECRET:dev-only-password-reset-change-me}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:payment-app-secret-key-change-this-in-production-please-make-it-long-enough}
  expiration: ${JWT_EXPIRATION_MS:86400000}
