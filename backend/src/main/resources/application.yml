server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: payment
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:0000}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  top-up:
    # Simulated top-up: credits the balance without a real payment.
    # Set TOPUP_ENABLED=false to disable it in a given environment.
    enabled: ${TOPUP_ENABLED:true}
  admin:
    # Optional bootstrap: leave ADMIN_EMAIL empty to disable it. If the email
    # already exists it is promoted to ADMIN; otherwise ADMIN_PASSWORD (min 8
    # characters) is used to create the account. Never expose these values in
    # the frontend bundle.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    nickname: ${ADMIN_NICKNAME:admin}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@payment-app.local}
  verification:
    secret: ${VERIFICATION_CODE_SECRET:dev-only-change-me}
  password-reset:
    secret: ${PASSWORD_RESET_TOKEN_SECRET:dev-only-password-reset-change-me}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:payment-app-secret-key-change-this-in-production-please-make-it-long-enough}
  expiration: ${JWT_EXPIRATION_MS:86400000}
