spring:
  datasource:
    url: jdbc:h2:mem:payment-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025

app:
  cors:
    allowed-origins: http://localhost:5173
  mail:
    from: no-reply@payment-app.local
  verification:
    secret: test-verification-secret
  password-reset:
    secret: test-password-reset-secret
    frontend-base-url: http://localhost:5173

jwt:
  secret: test-jwt-secret-key-that-is-long-enough-for-hs256
  expiration: 86400000
