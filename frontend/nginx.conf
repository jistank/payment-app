server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API and SSE go to Spring Boot. The empty Connection header keeps the
    # upstream connection alive; buffering must stay off for /api/events.
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed Vite assets can be cached aggressively.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Single-page application: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
